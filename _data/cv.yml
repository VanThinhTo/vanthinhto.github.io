        highlights:
          - Developed generative AI scoring workflows for dual EGFR and VEGFR targets.
          - Introduced orbital-information pretext tasks for self-supervised molecular representation learning.
          - Built applicability-domain analyses for HIV integrase virtual screening models.
          - Combined molecular similarity, neural networks, and GNINA docking for PD-L1 inhibitor discovery.
          - Trained ensemble and graph-based models for ALK inhibitor virtual screening.

